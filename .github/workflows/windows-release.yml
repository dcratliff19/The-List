name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Avoid silently switching the native compiler when windows-latest moves.
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      app_version: ${{ steps.package.outputs.version }}
      release_tag: ${{ steps.package.outputs.release_tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Validate the release version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: ./scripts/package-windows.ps1 -Tag $env:RELEASE_TAG -ValidateOnly
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        working-directory: native
        run: flutter pub get --enforce-lockfile
      - name: Check SQLite download safeguards
        run: ./scripts/tests/prepare-sqlite-windows.tests.ps1
      - name: Prepare verified SQLite runtime
        run: ./scripts/prepare-sqlite-windows.ps1
      - name: Check Dart formatting
        working-directory: native
        run: dart format --output=none --set-exit-if-changed lib test integration_test tools test_driver
      - name: Analyze the app
        working-directory: native
        run: flutter analyze
      - name: Test the app
        working-directory: native
        run: flutter test --reporter expanded
      - name: Compile Windows x64
        working-directory: native
        env:
          THE_LIST_SIGNAL_URL: ${{ vars.THE_LIST_SIGNAL_URL }}
        run: |
          $arguments = @('build', 'windows', '--release', '--no-pub')
          if ($env:THE_LIST_SIGNAL_URL) {
            $endpoint = $null
            if (-not [Uri]::TryCreate($env:THE_LIST_SIGNAL_URL, [UriKind]::Absolute, [ref]$endpoint) -or
                $endpoint.Scheme -ne 'https' -or $endpoint.UserInfo -or $endpoint.Query -or $endpoint.Fragment) {
              throw 'THE_LIST_SIGNAL_URL must be an HTTPS URL without credentials, query, or fragment.'
            }
            $arguments += "--dart-define=THE_LIST_SIGNAL_URL=$env:THE_LIST_SIGNAL_URL"
          }
          & flutter @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Windows compilation failed.' }
      - name: Package the runtime and illustrated guide
        id: package
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: The-List-Windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  publish-release:
    # Every successful manual/tag release build publishes its verified assets.
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    concurrency:
      group: windows-publish-${{ needs.build.outputs.release_tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Resolve existing annotated/lightweight tags to their source commit.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: The-List-Windows-x64
          path: dist
      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          APP_VERSION: ${{ needs.build.outputs.app_version }}
        run: ./scripts/publish-windows-release.ps1 -AppVersion $env:APP_VERSION -Tag $env:RELEASE_TAG -Commit $env:GITHUB_SHA
